# =============================================================================
# ReNovu - Coolify Deployment
# =============================================================================
# For Coolify with Traefik — no host port bindings, no custom networks.
# Coolify handles domain routing, TLS, Traefik labels, and networking.
#
# IMPORTANT: Do NOT define custom networks here. Coolify creates a shared
# network for all services in the stack. Adding a second network causes
# Traefik to randomly pick the wrong network, resulting in 504 errors.
#
# Set SERVICE_FQDN_* in Coolify UI to assign domains to each service.
#
# Required Environment Variables (set in Coolify):
#   JWT_SECRET             - JWT signing secret
#   STORE_ENCRYPTION_KEY   - 32-char encryption key
#   NOVU_SECRET_KEY        - Novu secret key
#   REDIS_PASSWORD         - Redis password
#   API_EXTERNAL_URL       - Browser-accessible API URL
#   WS_EXTERNAL_URL        - Browser-accessible WS URL
#   DASHBOARD_EXTERNAL_URL - Browser-accessible dashboard URL
#   ADMIN_TOOLS_EXTERNAL_URL - Browser-accessible admin tools URL
#   RENOVU_DATA_DIR        - Host data directory for persistent storage
# =============================================================================

name: renovu

services:
  # ---------------------------------------------------------------------------
  # Infrastructure - Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${RENOVU_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Infrastructure - MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ${RENOVU_DATA_DIR}/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_USER}", "--password", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/atlonxp/renovu-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    command: ["pm2-runtime", "start", "dist/main.js", "-i", "${PM2_INSTANCES:-max}"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEW_RELIC_ENABLED: "false"
      API_ROOT_URL: ${API_EXTERNAL_URL}
      FRONT_BASE_URL: ${DASHBOARD_EXTERNAL_URL}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: 6379
      REDIS_CACHE_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      IS_SELF_HOSTED: "true"
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Worker
  # ---------------------------------------------------------------------------
  worker:
    image: ghcr.io/atlonxp/renovu-worker:${IMAGE_TAG:-latest}
    platform: linux/amd64
    command: ["pm2-runtime", "start", "dist/main.js", "-i", "${PM2_INSTANCES:-max}"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3004
      NEW_RELIC_ENABLED: "false"
      API_ROOT_URL: http://api:3000
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: 6379
      REDIS_CACHE_PASSWORD: ${REDIS_PASSWORD}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      IS_SELF_HOSTED: "true"
      BROADCAST_QUEUE_CHUNK_SIZE: 100
      MULTICAST_QUEUE_CHUNK_SIZE: 100
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "pm2 pid main | grep -q '[0-9]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # WebSocket Server
  # ---------------------------------------------------------------------------
  ws:
    image: ghcr.io/atlonxp/renovu-ws:${IMAGE_TAG:-latest}
    platform: linux/amd64
    command: ["pm2-runtime", "start", "dist/main.js", "-i", "${PM2_INSTANCES:-max}"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      NEW_RELIC_ENABLED: "false"
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IS_SELF_HOSTED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    image: ghcr.io/atlonxp/renovu-dashboard:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      VITE_API_HOSTNAME: ${API_EXTERNAL_URL}
      VITE_SELF_HOSTED: "true"
      VITE_WEBSOCKET_HOSTNAME: ${WS_EXTERNAL_URL}
      VITE_ADMIN_TOOLS_HOSTNAME: ${ADMIN_TOOLS_EXTERNAL_URL}
      VITE_LEGACY_DASHBOARD_URL: ""
      VITE_CLERK_PUBLISHABLE_KEY: ""
      VITE_IS_EE: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get({hostname: 'localhost', port: 4000, path: '/', timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); });\""]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Admin Tools
  # ---------------------------------------------------------------------------
  admin-tools:
    image: ghcr.io/atlonxp/renovu-admin-tools:${IMAGE_TAG:-latest}
    platform: linux/amd64
    command: ["pm2-runtime", "start", "dist/main.js", "-i", "1"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      BACKUP_DIR: /tmp/admin-tools-backups
    volumes:
      - ${RENOVU_DATA_DIR}/admin-tools-backups:/tmp/admin-tools-backups
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3005/v1/health-check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
